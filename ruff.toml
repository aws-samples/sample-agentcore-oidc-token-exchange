line-length = 120
target-version = "py310"
extend-exclude = ["*.md", ".state", ".state-cn", ".build", "evidence"]

[lint]
select = ["E", "W", "F", "I", "N", "D", "ANN", "S", "B"]
ignore = [
  "D203", "D213",       # pick the Google-style pair (D211, D212)
  "S101",               # asserts are fine in tests
  "ANN401",             # Any is acceptable for parsed JSON
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S"]
